name: Store user-corrected Mobile Mystics artwork
on:
  push:
    paths:
      - '.github/workflows/store-mobile-mystics-correct-logos.yml'
permissions:
  contents: write
jobs:
  replace-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download confirmed event-specific logos
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 40 'https://media.canva.com/v2/image-resize/format:JPG/height:199/quality:75/uri:ifs%3A%2F%2FM%2Fd26e0728-3b36-48ac-8ad9-70eb0c1707a8/watermark:F/width:188?csig=AAAAAAAAAAAAAAAAAAAAAMvdIRxX2D2v3lXGFjdVlLT0Moi6eb4KXHM4zZyG2p4Y&exp=1794460478&osig=AAAAAAAAAAAAAAAAAAAAADwIMa81B0RWJ8QAbBKFkJUs8xlPc7yegmzm33XVNNye&signer=media-rpc&token=AAIAAU0AJGQyNmUwNzI4LTNiMzYtNDhhYy04YWQ5LTcwZWIwYzE3MDdhOAAAAAABoc4t6jCogOSK9Fhpn0LA4Ri5fDB0pSrq4j-rTxH_-hV4pIXPwA&x-canva-quality=thumbnail' -o 'public/images/event-logos/mobile-mystics-annual-ball-2027.jpg'
          curl --fail --location --retry 3 --max-time 40 'https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F66315cfe-ea7d-44a7-834e-3799392a44a2/watermark:F/width:196?csig=AAAAAAAAAAAAAAAAAAAAAGL9dnulb7lwmeefXwno6aULwPtU4bFJHKNumuB0NCeA&exp=1794459791&osig=AAAAAAAAAAAAAAAAAAAAAKIMa970itvBTvxwA2aEQsvdzT1GMF_A-dP2IEshDlVZ&signer=media-rpc&token=AAIAAU0AJDY2MzE1Y2ZlLWVhN2QtNDRhNy04MzRlLTM3OTkzOTJhNDRhMgAAAAABoc4jbpjrYmpX5fg4nmJ3-_so_M1Mw-HNajXSiZJSSbMxj4aOfQ&x-canva-quality=thumbnail' -o 'public/images/event-logos/mobile-mystics-pub-crawl-2027.jpg'
          curl --fail --location --retry 3 --max-time 40 'https://media.canva.com/v2/image-resize/format:JPG/height:186/quality:75/uri:ifs%3A%2F%2FM%2Fcd62cb71-01f9-4e3e-b093-c3091f1fc9fc/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAO_oGIY8iLimLMRB28Tj6hcK_Wykvq0G0mQ6ZGb8aQAK&exp=1794461896&osig=AAAAAAAAAAAAAAAAAAAAALm5ABite0joPwTqf74bhYs5Xng9tEmatNfe2h-lTGX5&signer=media-rpc&token=AAIAAU0AJGNkNjJjYjcxLTAxZjktNGUzZS1iMDkzLWMzMDkxZjFmYzlmYwAAAAABoc5DjUBwlcZaQnRLssUjDHZPV9SbEAB__mJog5ukYKf-lm5Qzw&x-canva-quality=thumbnail' -o 'public/images/event-logos/mobile-mystics-touchdown-bingo-2026.jpg'
          test "$(wc -c < 'public/images/event-logos/mobile-mystics-annual-ball-2027.jpg')" -gt 5000
          test "$(wc -c < 'public/images/event-logos/mobile-mystics-pub-crawl-2027.jpg')" -gt 5000
          test "$(wc -c < 'public/images/event-logos/mobile-mystics-touchdown-bingo-2026.jpg')" -gt 5000
          file 'public/images/event-logos/mobile-mystics-annual-ball-2027.jpg'
          file 'public/images/event-logos/mobile-mystics-pub-crawl-2027.jpg'
          file 'public/images/event-logos/mobile-mystics-touchdown-bingo-2026.jpg'
      - name: Commit corrected artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm 'public/images/event-logos/mobile-mystics-annual-ball-2027.png'
          git rm 'public/images/event-logos/mobile-mystics-pub-crawl-2027.png'
          git rm 'public/images/event-logos/mobile-mystics-touchdown-bingo-2026.png'
          git add 'public/images/event-logos/mobile-mystics-annual-ball-2027.jpg'
          git add 'public/images/event-logos/mobile-mystics-pub-crawl-2027.jpg'
          git add 'public/images/event-logos/mobile-mystics-touchdown-bingo-2026.jpg'
          git rm '.github/workflows/check-mobile-mystics-image.yml'
          git rm '.github/workflows/store-mobile-mystics-correct-logos.yml'
          git commit -m 'Replace Mobile Mystics calendar logos with user-provided correct images'
          git push
